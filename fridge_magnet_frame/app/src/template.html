<title>صانع لوحة الاسم</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: preview of the plate in its frame tab on top, a single column of
   control groups below (two columns on wide screens), download bar pinned. */
:root {
  --bg: #eceff5;
  --surface: #ffffff;
  --surface-2: #f5f7fb;
  --ink: #17203a;
  --muted: #5d667c;
  --line: #d8dde8;
  --accent: #e2602a;          /* filament orange */
  --accent-ink: #ffffff;
  --accent-soft: #fde9df;
  --plate: #22304f;
  --warn-bg: #fff3e6;
  --warn-ink: #8a3d10;
  --ok-ink: #22704a;
  --stage-top: #f7f8fb;
  --stage-bottom: #dfe4ee;
  --font-display: "Reem Kufi", "IBM Plex Sans Arabic", system-ui, sans-serif;
  --font-body: "IBM Plex Sans Arabic", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1220; --surface: #151c2f; --surface-2: #1b2339; --ink: #e8ecf5; --muted: #9ba4ba; --line: #283252;
    --accent: #ff8a4c; --accent-ink: #1b0d05; --accent-soft: #3a2316; --plate: #2e3f66;
    --warn-bg: #3a2414; --warn-ink: #ffc59b; --ok-ink: #7fd6a6; --stage-top: #1a2238; --stage-bottom: #0f1526;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1220; --surface: #151c2f; --surface-2: #1b2339; --ink: #e8ecf5; --muted: #9ba4ba; --line: #283252;
  --accent: #ff8a4c; --accent-ink: #1b0d05; --accent-soft: #3a2316; --plate: #2e3f66;
  --warn-bg: #3a2414; --warn-ink: #ffc59b; --ok-ink: #7fd6a6; --stage-top: #1a2238; --stage-bottom: #0f1526;
  color-scheme: dark;
}
html { direction: rtl; }
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 18px 110px;
}
.wrap { max-width: 1180px; margin-inline: auto; display: grid; gap: 16px; }
header.top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
header.top h1 { font-family: var(--font-display); font-size: clamp(24px, 4vw, 32px); margin: 0; line-height: 1.2; text-wrap: balance; }
header.top p { margin: 0; color: var(--muted); flex-basis: 100%; }
.mark { width: 44px; height: 30px; flex: none; }
.app { display: grid; gap: 16px; grid-template-columns: 1fr; }
@media (min-width: 900px) { .app { grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); align-items: start; }
  .stage { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); } }
.stage, .group { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.stage { padding: 12px; display: grid; gap: 10px; min-width: 0; }
.viewer { position: relative; border-radius: 10px; overflow: hidden; aspect-ratio: 16 / 11; max-width: 100%;
  background: linear-gradient(180deg, var(--stage-top), var(--stage-bottom)); }
.viewer canvas { display: block; width: 100%; height: 100%; touch-action: none; }
.viewbtns { position: absolute; inset-inline-start: 8px; top: 8px; display: flex; gap: 6px; flex-wrap: wrap; }
.viewbtns button, .seg button, .tabs button {
  font: inherit; font-size: 13px; border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  border-radius: 999px; padding: 5px 12px; cursor: pointer; }
.viewbtns button[aria-pressed="true"], .seg button[aria-pressed="true"], .tabs button[aria-selected="true"] {
  background: var(--ink); color: var(--surface); border-color: var(--ink); }
.facts { display: flex; flex-wrap: wrap; gap: 6px; font-size: 13px; }
.facts span { background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 3px 9px; font-variant-numeric: tabular-nums; }
.facts b { font-weight: 600; }
.warn { background: var(--warn-bg); color: var(--warn-ink); border-radius: 10px; padding: 8px 12px; font-size: 14px; }
.swatchrow { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.swatchrow .lbl { min-width: 74px; }
.sw { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--surface); box-shadow: 0 0 0 1px var(--line); cursor: pointer; padding: 0; }
.sw[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--accent); }
.panel { display: grid; gap: 12px; min-width: 0; }
.group { padding: 14px; display: grid; gap: 10px; min-width: 0; }
.group h2 { font-family: var(--font-display); font-size: 18px; margin: 0; letter-spacing: .2px; }
label, .lab { font-size: 14px; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
label output { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
input[type="text"] {
  font: inherit; font-size: 18px; width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--surface-2); color: var(--ink); }
input[type="text"]:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
input[type="range"] { width: 100%; accent-color: var(--accent); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips button { font-size: 18px; min-width: 38px; height: 36px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); cursor: pointer; font-family: system-ui, sans-serif; }
.tabs, .seg { display: flex; gap: 6px; flex-wrap: wrap; }
.fontgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; max-height: 330px; overflow-y: auto; padding: 2px; }
.fontcard { border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); color: var(--ink); padding: 8px 10px; cursor: pointer;
  text-align: center; min-width: 0; display: grid; gap: 2px; }
.fontcard .sample { font-size: 22px; line-height: 1.35; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fontcard .nm { font-size: 11px; color: var(--muted); font-family: var(--font-body); direction: ltr; }
.fontcard[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); box-shadow: 0 0 0 1px var(--accent); }
.icongrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(46px, 1fr)); gap: 6px; }
.icongrid button { aspect-ratio: 1; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); cursor: pointer; padding: 7px; display: grid; place-items: center; color: var(--ink); font: inherit; font-size: 12px; }
.icongrid button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); box-shadow: 0 0 0 1px var(--accent); }
.icongrid canvas { width: 100%; height: 100%; }
.switch { justify-content: flex-start; gap: 10px; color: var(--ink); cursor: pointer; }
.switch input { width: 18px; height: 18px; accent-color: var(--accent); }
.filebtn { display: inline-flex; gap: 8px; align-items: center; border: 1px dashed var(--line); border-radius: 10px; padding: 8px 12px; cursor: pointer; color: var(--ink); }
.filebtn input { position: absolute; width: 1px; height: 1px; opacity: 0; }
.note { margin: 0; font-size: 13px; color: var(--muted); }
.note b { color: var(--ink); }
.row2 { display: grid; gap: 10px; grid-template-columns: 1fr 1fr; }
@media (max-width: 480px) { .row2 { grid-template-columns: 1fr; } }
.dlbar { position: fixed; inset: auto 0 0 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line);
  padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.dlbar .in { max-width: 1180px; margin-inline: auto; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.primary { font: inherit; font-weight: 700; font-size: 16px; background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 12px; padding: 12px 22px; cursor: pointer; }
.primary:disabled { opacity: .55; cursor: wait; }
#dlmsg { font-size: 13px; color: var(--muted); min-width: 0; flex: 1 1 220px; }
#dlmsg.ok { color: var(--ok-ink); }
#dlmsg.bad { color: var(--warn-ink); }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>

<div class="wrap">
  <header class="top">
    <svg class="mark" viewBox="0 0 44 30" aria-hidden="true"><rect x="1" y="1" width="42" height="20" rx="6" fill="var(--plate)"/><rect x="12" y="14" width="20" height="14" rx="5" fill="var(--plate)"/><rect x="14.5" y="17.5" width="15" height="7" rx="3.5" fill="var(--accent)"/></svg>
    <h1>صانع لوحة الاسم</h1>
    <p>اكتب الاسم واختر الخط والرموز، وحمّل ملف اللوحة جاهز يركب على برواز الثلاجة.</p>
  </header>

  <main class="app">
    <section class="stage" aria-label="معاينة اللوحة">
      <div class="viewer" id="viewer">
        <canvas id="gl" aria-label="معاينة ثلاثية الأبعاد، اسحب للتدوير"></canvas>
        <div class="viewbtns" role="group" aria-label="زاوية المعاينة">
          <button type="button" data-view="front" aria-pressed="true">من قدام</button>
          <button type="button" data-view="angle" aria-pressed="false">مائل</button>
          <button type="button" data-view="plate" aria-pressed="false">اللوحة لحالها</button>
        </div>
      </div>
      <div class="facts" id="facts"></div>
      <div class="warn" id="warn" hidden></div>
      <div class="swatchrow" id="plateSw"><span class="lbl">لون البرواز</span></div>
      <div class="swatchrow" id="textSw"><span class="lbl">لون الكتابة</span></div>
    </section>

    <div class="panel">
      <section class="group" aria-labelledby="g1">
        <h2 id="g1">الكتابة</h2>
        <label for="line1">السطر الأول</label>
        <input type="text" id="line1" dir="auto" maxlength="40" autocomplete="off">
        <div class="chips" id="sym" aria-label="رموز تنضاف للنص"></div>
        <label for="line2">سطر ثاني (اختياري)</label>
        <input type="text" id="line2" dir="auto" maxlength="40" placeholder="مثلاً 2026" autocomplete="off">
      </section>

      <section class="group" aria-labelledby="g2">
        <h2 id="g2">الخط</h2>
        <div class="tabs" role="tablist" id="fontTabs">
          <button type="button" role="tab" data-g="ar" aria-selected="false">عربي</button>
          <button type="button" role="tab" data-g="en" aria-selected="true">إنجليزي</button>
          <button type="button" role="tab" data-g="sc" aria-selected="false">مزخرف</button>
          <button type="button" role="tab" data-g="up" aria-selected="false">خطك الخاص</button>
        </div>
        <div class="fontgrid" id="fontgrid"></div>
        <div id="upbox" hidden>
          <label class="filebtn" for="fontfile">رفع ملف خط (TTF أو OTF أو WOFF)<input type="file" id="fontfile" accept=".ttf,.otf,.woff,.woff2"></label>
          <p class="note" id="upname">أي خط عندك في جوالك أو كمبيوترك يشتغل هنا.</p>
        </div>
      </section>

      <section class="group" aria-labelledby="g3">
        <h2 id="g3">الرموز</h2>
        <div class="seg" role="group" aria-label="مكان الرمز" id="iconSide">
          <button type="button" data-side="L" aria-pressed="true">رمز يسار الكتابة</button>
          <button type="button" data-side="R" aria-pressed="false">رمز يمين الكتابة</button>
        </div>
        <div class="icongrid" id="icongrid"></div>
        <label for="iconScale">حجم الرمز <output id="iconScaleOut"></output></label>
        <input type="range" id="iconScale" min="0.6" max="1.6" step="0.05">
      </section>

      <section class="group" aria-labelledby="g4">
        <h2 id="g4">الحجم والسماكة</h2>
        <label class="switch" for="auto"><input type="checkbox" id="auto"> تكبير تلقائي يملأ اللوحة</label>
        <label for="size">ارتفاع الكتابة <output id="sizeOut"></output></label>
        <input type="range" id="size" min="2.5" max="7.5" step="0.1">
        <label for="thick">سماكة الحروف <output id="thickOut"></output></label>
        <input type="range" id="thick" min="-0.15" max="0.4" step="0.01">
        <label for="spacing">تباعد الحروف <output id="spacingOut"></output></label>
        <input type="range" id="spacing" min="-0.05" max="0.4" step="0.01">
        <label for="l2">حجم السطر الثاني <output id="l2Out"></output></label>
        <input type="range" id="l2" min="0.4" max="1" step="0.05">
      </section>

      <section class="group" aria-labelledby="g5">
        <h2 id="g5">الطباعة</h2>
        <div class="seg" role="group" aria-label="نوع الكتابة" id="modeSeg">
          <button type="button" data-mode="raised" aria-pressed="true">كتابة بارزة</button>
          <button type="button" data-mode="engraved" aria-pressed="false">كتابة محفورة</button>
        </div>
        <label for="height"><span id="heightLbl">ارتفاع البروز</span> <output id="heightOut"></output></label>
        <input type="range" id="height" min="0.4" max="1.2" step="0.1">
        <div class="seg" role="group" aria-label="قوة التثبيت" id="gripSeg">
          <button type="button" data-grip="normal" aria-pressed="true">تثبيت عادي</button>
          <button type="button" data-grip="tight" aria-pressed="false">تثبيت أقوى</button>
        </div>
        <label class="switch" for="two"><input type="checkbox" id="two"> أضف ملفين للطباعة بلونين (AMS)</label>
        <p class="note" id="printNote"></p>
      </section>
    </div>
  </main>
</div>

<div class="dlbar">
  <div class="in">
    <button type="button" class="primary" id="dl">تحميل ملف الطباعة</button>
    <span id="dlmsg" role="status">ملف ZIP فيه ملف STL للوحة وطريقة الطباعة.</span>
  </div>
</div>

    : 'اطبعها مثل ما هي في الملف، الوجه لفوق. طبقة 0.2 ملم، بدون دعامات. تقدر تعبي الحفر بلون أو صبغ بعد الطباعة.';
  $('printNote').innerHTML = p;
}
function schedule() { clearTimeout(timer); timer = setTimeout(regen, 90); persist(); refreshOutputs(); }
function regen() {
  var my = ++token, f = fontObj();
  ensureFont(f, state.line1 + state.line2).then(function () {
    if (my !== token) return;
    var res;
    try { res = outlines(); } catch (e) { console.error(e); res = { polys: [], L: null, lost: 0, clipped: 0 }; }
    current = res; updatePlateMesh(res.polys); updateFacts(res);
  });
}
function bbox(polys) {
  var x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  polys.forEach(function (p) { p[0].forEach(function (q) { x0 = Math.min(x0, q[0]); x1 = Math.max(x1, q[0]); y0 = Math.min(y0, q[1]); y1 = Math.max(y1, q[1]); }); });
  return polys.length ? [x1 - x0, y1 - y0] : [0, 0];
}
function updateFacts(res) {
  var bb = bbox(res.polys), facts = $('facts');
  facts.textContent = '';
  function chip(lbl, val) { var s = document.createElement('span'); s.append(lbl + ' '); var b = document.createElement('b'); b.textContent = val; s.append(b); facts.append(s); }
  chip('مقاس الكتابة', fmt(bb[0]) + ' × ' + fmt(bb[1]) + ' ملم');
  chip(state.mode === 'raised' ? 'البروز' : 'الحفر', fmt(state.height) + ' ملم');
  if (state.mode === 'raised') chip('تغيير اللون عند', fmt(ZTOP) + ' ملم');
  chip('اللوحة', '29.6 × 8 ملم');
  var msgs = [];
  if (!res.polys.length) msgs.push('اكتب كلمة أو اختر رمز عشان تطلع على اللوحة.');
  if (res.clipped > 0.004) msgs.push('جزء من الكتابة طالع برا حدود اللوحة وانقص. صغّر الحجم أو شغّل التكبير التلقائي.');
  if (res.lost > 0.06) msgs.push('بعض الخطوط أرفع من 0.4 ملم وما راح تنطبع زين بالفوهة العادية. زد سماكة الحروف أو الحجم، أو اختر خط أعرض.');
  var w = $('warn'); w.hidden = !msgs.length; w.textContent = msgs.join(' ');
}

function buildSymbols() {
  var box = $('sym');
  SYMBOLS.forEach(function (s) {
    var b = document.createElement('button'); b.type = 'button'; b.textContent = s.replace('︎', ''); b.title = 'أضف ' + s;
    b.addEventListener('click', function () {
      var inp = document.activeElement === $('line2') ? $('line2') : $('line1'), st = inp.selectionStart != null ? inp.selectionStart : inp.value.length;
      inp.value = inp.value.slice(0, st) + s + inp.value.slice(inp.selectionEnd != null ? inp.selectionEnd : st);
      state[inp.id] = inp.value; schedule(); inp.focus();
    });
    b.addEventListener('mousedown', function (e) { e.preventDefault(); });
    box.append(b);
  });
}
var io = 'IntersectionObserver' in window ? new IntersectionObserver(function (es) {
  es.forEach(function (e) { if (e.isIntersecting) { addFont(e.target._font); io.unobserve(e.target); } });
}, { root: null, rootMargin: '120px' }) : null;
function sampleText() { var t = (state.line1 || '').trim(); return t || (state.tab === 'ar' ? 'تركيا' : 'TURKEY'); }
function buildFontGrid() {
  var grid = $('fontgrid'); grid.textContent = '';
  $('upbox').hidden = state.tab !== 'up';
  var list = state.tab === 'up' ? (USER_FONT.label ? [USER_FONT] : []) : FONTS.filter(function (f) { return f.g === state.tab; });
  list.forEach(function (f) {
    var b = document.createElement('button'); b.type = 'button'; b.className = 'fontcard'; b._font = f;
    b.setAttribute('aria-pressed', String(state.font === f.f));
    var s = document.createElement('span'); s.className = 'sample'; s.textContent = sampleText();
    s.style.fontFamily = '"' + f.f + '", "IBM Plex Sans Arabic", sans-serif'; s.style.fontWeight = f.w; s.dir = 'auto';
    var n = document.createElement('span'); n.className = 'nm'; n.textContent = f.label || f.f;
    b.append(s, n);
    b.addEventListener('click', function () { state.font = f.f; grid.querySelectorAll('.fontcard').forEach(function (x) { x.setAttribute('aria-pressed', String(x === b)); }); schedule(); });
    grid.append(b);
    if (io && f.g !== 'up') io.observe(b); else addFont(f);
  });
  document.querySelectorAll('#fontTabs button').forEach(function (t) { t.setAttribute('aria-selected', String(t.dataset.g === state.tab)); });
}
function refreshSamples() { var t = sampleText(); document.querySelectorAll('.fontcard .sample').forEach(function (s) { s.textContent = t; }); }
var iconSide = 'L';
function buildIcons() {
  var grid = $('icongrid'); grid.textContent = '';
  var cur = iconSide === 'L' ? state.iconL : state.iconR;
  var none = document.createElement('button'); none.type = 'button'; none.textContent = 'بدون'; none.setAttribute('aria-pressed', String(!cur));
  none.addEventListener('click', function () { setIcon(''); }); grid.append(none);
  Object.keys(ICONS).forEach(function (k) {
    var b = document.createElement('button'); b.type = 'button'; b.title = ICONS[k][0]; b.setAttribute('aria-label', ICONS[k][0]);
    b.setAttribute('aria-pressed', String(cur === k));
    var cv = document.createElement('canvas'); cv.width = cv.height = 64; var c = cv.getContext('2d');
    var src = iconCanvas(k, 128); c.drawImage(src, 0, 0, 64, 64); c.globalCompositeOperation = 'source-in';
    c.fillStyle = getComputedStyle(document.body).color || '#17203a'; c.fillRect(0, 0, 64, 64);
    b.append(cv); b.addEventListener('click', function () { setIcon(k); }); grid.append(b);
  });
}
function setIcon(k) { if (iconSide === 'L') state.iconL = k; else state.iconR = k; buildIcons(); schedule(); }
function swatches(id, list, keyName) {
  var row = $(id);
  list.forEach(function (c) {
    var b = document.createElement('button'); b.type = 'button'; b.className = 'sw'; b.style.background = c; b.setAttribute('aria-label', c);
    b.setAttribute('aria-pressed', String(state[keyName] === c));
    b.addEventListener('click', function () {
      state[keyName] = c; row.querySelectorAll('.sw').forEach(function (x) { x.setAttribute('aria-pressed', String(x === b)); });
      if (keyName === 'plateColor') frameMat.color.set(c);
      persist(); updatePlateMesh(current.polys);
    });
    row.append(b);
  });
}
function segment(id, attr, keyName) {
  document.querySelectorAll('#' + id + ' button').forEach(function (b) {
    b.setAttribute('aria-pressed', String(b.dataset[attr] === state[keyName]));
    b.addEventListener('click', function () {
      state[keyName] = b.dataset[attr];
      document.querySelectorAll('#' + id + ' button').forEach(function (x) { x.setAttribute('aria-pressed', String(x === b)); });
      if (keyName === 'mode') { state.height = Math.min(state.height, state.mode === 'engraved' ? 1.0 : 1.2); $('height').max = state.mode === 'engraved' ? '1' : '1.2'; $('height').value = state.height; }
      schedule();
    });
  });
}
function bindRange(id, keyName) { var el = $(id); el.value = state[keyName]; el.addEventListener('input', function () { state[keyName] = parseFloat(el.value); schedule(); }); }

// font upload
$('fontfile').addEventListener('change', function () {
  var file = this.files && this.files[0]; if (!file) return;
  file.arrayBuffer().then(function (buf) {
    var ff = new FontFace(USER_FONT.f, buf);
    return ff.load().then(function (loaded) {
      document.fonts.add(loaded); USER_FONT.label = file.name.replace(/\.[^.]+$/, ''); iconCache = {};
      state.font = USER_FONT.f; $('upname').textContent = 'الخط المستخدم: ' + USER_FONT.label; buildFontGrid(); schedule();
    });
  }).catch(function () { $('upname').textContent = 'ما قدرت أقرأ هذا الملف. جرّب ملف TTF أو OTF.'; });
});

// ---------------------------------------------------------------- download
var downloads = null, inViewer = !!(window.claude && window.claude.use);
if (inViewer) window.claude.use('downloads').then(function (d) { downloads = d; }).catch(function () {});
function slug() {
  var t = (state.line1 + ' ' + state.line2).replace(/[^A-Za-z0-9]+/g, '_').replace(/^_+|_+$/g, '').slice(0, 30);
  return 'nameplate' + (t ? '_' + t : '');
}
function instructions(name, files) {
  return [
    'لوحة الاسم: ' + (state.line1 || '') + (state.line2 ? ' / ' + state.line2 : ''),
    'الخط: ' + (fontObj().label || fontObj().f) + '   التثبيت: ' + (state.grip === 'tight' ? 'أقوى' : 'عادي'),
    '',
    'الملفات:',
    files.map(function (f) { return '  - ' + f; }).join('\n'),
    '',
    'الطباعة:',
    '  - اطبع الملف مثل ما هو: الظهر على السرير والكتابة لفوق. بدون دعامات.',
    '  - طبقة 0.2 ملم، 3 جدران، حشوة 15٪.',
    state.mode === 'raised'
      ? '  - للكتابة بلون ثاني: أضف تغيير فلمنت (Color change / M600) عند ارتفاع ' + fmt(ZTOP) + ' ملم.\n  - ولو عندك AMS: افتح ' + name + '_base.stl و ' + name + '_text.stl كجزأين لنفس القطعة، وكل جزء بلونه.'
      : '  - الكتابة محفورة ' + fmt(state.height) + ' ملم: تقدر تعبيها بصبغ أو قلم بعد الطباعة.',
    '',
    'التركيب: ادف اللوحة من ورا في فتحة لسان البرواز لين تثبت. ولتغييرها ادفها من قدام.',
    ''
  ].join('\n');
}
function makeZip() {
  var base = BASES[state.grip], polys = current.polys, name = slug(), mode = polys.length ? state.mode : 'none', files = [];
  files.push({ name: name + '.stl', data: NP.stl(NP.buildPlate(base, polys, mode, state.height), name) });
  if (mode === 'raised' && state.two) {
    files.push({ name: name + '_base.stl', data: NP.stl(NP.buildPlate(base, [], 'none', 0), name) });
    files.push({ name: name + '_text.stl', data: NP.stl(NP.buildText(base, polys, state.height), name) });
  }
  var txt = 'طريقة_الطباعة.txt';
  files.push({ name: txt, data: new TextEncoder().encode(instructions(name, files.map(function (f) { return f.name; }))) });
  return { name: name, bytes: NP.zip(files) };
}
function setMsg(t, cls) { var m = $('dlmsg'); m.textContent = t; m.className = cls || ''; }
$('dl').addEventListener('click', function () {
  var z;
  try { z = makeZip(); } catch (e) { console.error(e); setMsg('صار خطأ وأنا أجهز الملف. غيّر النص شوي وجرّب مرة ثانية.', 'bad'); return; }
  var filename = z.name + '.zip', blob = new Blob([z.bytes], { type: 'application/zip' });
  if (downloads) {
    downloads.save({ filename: filename, data: blob }).then(function () { setMsg('تم. افتح ملف ' + filename + ' وطلّع منه ملف STL.', 'ok'); })
      .catch(function (e) {
        var c = e && e.code;
        if (c === 'declined') setMsg('ألغيت التحميل. اضغط الزر مرة ثانية لما تكون جاهز.');
        else if (c === 'rate_limited') setMsg('فيه نافذة تحميل مفتوحة. انتظر ثواني وجرّب.');
        else if (c === 'host_unavailable') setMsg('هذا التطبيق ما يقدر يحفظ ملفات هنا. افتح الصفحة في المتصفح أو من الكمبيوتر.', 'bad');
        else if (c === 'extension_not_enabled') setMsg('ملفات ZIP مو متاحة في هذا العرض. افتح الصفحة من claude.ai في المتصفح.', 'bad');
        else setMsg('ما قدرت أحفظ الملف هنا. افتح الصفحة من claude.ai في المتصفح وجرّب.', 'bad');
      });
  } else if (!inViewer) {
    var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename; document.body.append(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000); setMsg('تم تجهيز ' + filename + '.', 'ok');
  } else {
    setMsg('التحميل مو متاح في هذا العرض. افتح الصفحة من claude.ai في المتصفح.', 'bad');
  }
});
window.__nameplate = { state: state, makeZip: makeZip, current: function () { return current; }, regen: regen };

// ---------------------------------------------------------------- start
$('line1').value = state.line1; $('line2').value = state.line2; $('auto').checked = state.auto; $('two').checked = state.two;
['line1', 'line2'].forEach(function (id) { $(id).addEventListener('input', function () { state[id] = this.value; refreshSamples(); schedule(); }); });
$('auto').addEventListener('change', function () { state.auto = this.checked; schedule(); });
$('two').addEventListener('change', function () { state.two = this.checked; persist(); });
bindRange('size', 'size'); bindRange('thick', 'thick'); bindRange('spacing', 'spacing'); bindRange('l2', 'l2'); bindRange('iconScale', 'iconScale'); bindRange('height', 'height');
if (!('letterSpacing' in mctx)) { $('spacing').disabled = true; $('spacingOut').textContent = 'غير مدعوم في هذا المتصفح'; }
segment('modeSeg', 'mode', 'mode'); segment('gripSeg', 'grip', 'grip');
document.querySelectorAll('#iconSide button').forEach(function (b) { b.addEventListener('click', function () {
  iconSide = b.dataset.side; document.querySelectorAll('#iconSide button').forEach(function (x) { x.setAttribute('aria-pressed', String(x === b)); }); buildIcons(); }); });
document.querySelectorAll('#fontTabs button').forEach(function (t) { t.addEventListener('click', function () { state.tab = t.dataset.g; persist(); buildFontGrid(); }); });
document.querySelectorAll('.viewbtns button').forEach(function (b) { b.addEventListener('click', function () { setView(b.dataset.view); }); });
swatches('plateSw', PLATE_COLORS, 'plateColor'); swatches('textSw', TEXT_COLORS, 'textColor'); frameMat.color.set(state.plateColor);
buildSymbols(); buildFontGrid(); buildIcons(); refreshOutputs(); resize(); setView('front'); regen();
})();
</script>
