<!doctype html>
<html><head><meta charset="utf-8"><title>Cup keychain render</title>
<style>html,body{margin:0;background:#efe9e0;overflow:hidden}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"./package/build/three.module.js"}}</script>
</head><body>
<script type="module">
import * as THREE from 'three';
import { STLLoader } from './package/examples/jsm/loaders/STLLoader.js';
import { RoomEnvironment } from './package/examples/jsm/environments/RoomEnvironment.js';

const q = new URLSearchParams(location.search);
const view = q.get('view') || 'hero';
const base = q.get('base') || '../dist3d/25cafe_3d_cup_keychain';
const W = +q.get('w') || 1000, H = +q.get('h') || 1000;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(window.devicePixelRatio); renderer.setSize(W, H);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.0;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(view === 'plate' ? 0xe9e6e1 : 0xefe9e0);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
const mat = (c, r = 0.62) => new THREE.MeshStandardMaterial({ color: c, roughness: r, metalness: 0.0, envMapIntensity: 0.55 });
const COLORS = { '1_black': mat(0x1d1d1d, 0.5), '2_beige': mat(0xd3c2a4), '3_brown': mat(0x4b3324), '4_white': mat(0xf1eee8) };
const loader = new STLLoader();
const geos = {};
for (const t of Object.keys(COLORS)) geos[t] = await new Promise(res => loader.load(`${base}_${t}.stl`, g => { g.computeVertexNormals(); res(g); }));
function cup() {   // STL is Z-up; three.js is Y-up
  const g = new THREE.Group();
  for (const t of Object.keys(COLORS)) { const m = new THREE.Mesh(geos[t], COLORS[t]); m.castShadow = m.receiveShadow = true; g.add(m); }
  g.rotation.x = -Math.PI / 2; return g;
}
const key = new THREE.DirectionalLight(0xffffff, 2.3); key.castShadow = true;
key.shadow.mapSize.set(4096, 4096); key.shadow.bias = -0.0003; key.shadow.normalBias = 0.02;
scene.add(key); scene.add(key.target); scene.add(new THREE.HemisphereLight(0xffffff, 0xd8cfc2, 0.55));
const fill = new THREE.DirectionalLight(0xfff4e6, 0.7); scene.add(fill);
let camera;
// in world coords: cup axis = +Y, logo faces -X, text faces +X, loop hole axis = X, lid top at y=36
if (view === 'plate') {
  const pw = 330, pd = 320, n = +q.get('n') || 6, pitch = 33;
  const plate = new THREE.Mesh(new THREE.BoxGeometry(pw, 2, pd), new THREE.MeshStandardMaterial({ color: 0x3a3a3c, roughness: 0.85 }));
  plate.position.y = -1; plate.receiveShadow = true; scene.add(plate);
  let cnt = 0;
  for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
    const g = cup(); g.position.set(-((n - 1) * pitch) / 2 + i * pitch - 25, 0, -((n - 1) * pitch) / 2 + j * pitch);
    scene.add(g); cnt++;
  }
  const tower = new THREE.Mesh(new THREE.BoxGeometry(35, 44, 35), mat(0x8a7a66));
  tower.position.set(((n - 1) * pitch) / 2 + 40, 22, ((n - 1) * pitch) / 2 - 10); tower.castShadow = true; scene.add(tower);
  document.title = 'count=' + cnt;
  key.position.set(-160, 420, 260); Object.assign(key.shadow.camera, { left: -230, right: 230, top: 230, bottom: -230, near: 10, far: 1000 });
  fill.position.set(200, 120, -100);
  camera = new THREE.PerspectiveCamera(30, W / H, 1, 3000); camera.position.set(-60, 420, 470); camera.lookAt(0, 10, 0);
} else {
  const g = cup(); scene.add(g);
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(3000, 3000), new THREE.ShadowMaterial({ opacity: 0.2 }));
  ground.receiveShadow = true;
  if (view === 'hero') {   // hanging from a split ring, shadow on a wall behind
    const ring = new THREE.Mesh(new THREE.TorusGeometry(12, 0.9, 32, 180), new THREE.MeshStandardMaterial({ color: 0xd8d8dc, metalness: 1, roughness: 0.22 }));
    ring.rotation.y = Math.PI / 2; ring.position.set(0, 36 + 2.6 + 12 - 2.25 + 0.9, 0); ring.castShadow = true; scene.add(ring);
    ground.rotation.y = Math.PI / 2; ground.position.x = 40; scene.add(ground);
  } else { ground.rotation.x = -Math.PI / 2; scene.add(ground); }
  const cfg = {
    hero:  { pos: [-125, 48, -52], look: [0, 30, 0], fov: 30, light: [-90, 120, -60] },
    front: { pos: [-150, 26, 0], look: [0, 21.5, 0], fov: 22, light: [-120, 110, 60] },
    back:  { pos: [150, 24, 0], look: [0, 19, 0], fov: 22, light: [120, 110, -60] },
    side:  { pos: [-100, 30, -110], look: [0, 20, 0], fov: 24, light: [-60, 120, -140] },
    top:   { pos: [-60, 110, -45], look: [0, 30, 0], fov: 24, light: [-60, 160, 40] },
    macro: { pos: [-66, 22, -16], look: [0, 15, -1], fov: 22, light: [-110, 70, -60] },
  }[view];
  camera = new THREE.PerspectiveCamera(cfg.fov, W / H, 1, 3000); camera.position.set(...cfg.pos);
  key.position.set(...cfg.light); key.target.position.set(...cfg.look);
  Object.assign(key.shadow.camera, { left: -80, right: 80, top: 80, bottom: -80, near: 1, far: 600 });
  fill.position.set(-cfg.light[0] * 0.3 + 80, cfg.light[1] * 0.3, -cfg.light[2]);
  camera.lookAt(...cfg.look);
}
renderer.render(scene, camera);
document.body.dataset.done = '1';
</script></body></html>
