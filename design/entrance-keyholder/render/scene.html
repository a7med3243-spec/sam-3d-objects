<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>html,body{margin:0;background:#ddd;overflow:hidden}canvas{display:block}</style>
<script type="importmap">
{"imports":{"three":"/three/build/three.module.js","three/addons/":"/three/examples/jsm/"}}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { STLLoader } from 'three/addons/loaders/STLLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const cfg = JSON.parse(decodeURIComponent(location.hash.slice(1)));
const W = cfg.width || 1600, H = cfg.height || 1200;

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(W, H);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = cfg.exposure || 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.VSMShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;
scene.environmentIntensity = cfg.envIntensity ?? 0.55;

// ---------- procedural textures ----------
function hash(x, y) { const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return s - Math.floor(s); }
function vnoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash(xi, yi), b = hash(xi + 1, yi), c = hash(xi, yi + 1), d = hash(xi + 1, yi + 1);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
function fbm(x, y, o = 4) { let s = 0, a = 0.5, f = 1; for (let i = 0; i < o; i++) { s += a * vnoise(x * f, y * f); f *= 2; a *= 0.5; } return s; }

function canvasTex(size, fn, repeat = 1) {
  const c = document.createElement('canvas'); c.width = c.height = size;
  const ctx = c.getContext('2d'); const img = ctx.createImageData(size, size);
  for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
    const [r, g, b] = fn(x / size, y / size); const i = (y * size + x) * 4;
    img.data[i] = r; img.data[i + 1] = g; img.data[i + 2] = b; img.data[i + 3] = 255;
  }
  ctx.putImageData(img, 0, 0);
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(repeat, repeat); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
  return t;
}
function hex2rgb(h) { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }

function wallTexture(hex, kind) {
  const [r0, g0, b0] = hex2rgb(hex);
  return canvasTex(512, (u, v) => {
    let k;
    if (kind === 'linen') {
      const weave = 0.5 + 0.5 * Math.sin(u * 512 * 1.6) * Math.sin(v * 512 * 1.6);
      k = 0.93 + 0.05 * weave + 0.06 * (fbm(u * 40, v * 3) - 0.5) + 0.04 * (fbm(u * 3, v * 40) - 0.5);
    } else {
      k = 0.95 + 0.09 * (fbm(u * 18, v * 18, 5) - 0.5);
    }
    return [r0 * k, g0 * k, b0 * k];
  }, 1);
}
function woodTexture(hex) {
  const [r0, g0, b0] = hex2rgb(hex);
  return canvasTex(1024, (u, v) => {
    const n = fbm(u * 3, v * 22, 4);
    const ring = 0.5 + 0.5 * Math.sin((v * 60 + n * 9) * Math.PI);
    const fine = fbm(u * 60, v * 300, 2);
    const k = 0.84 + 0.09 * ring + 0.10 * (fine - 0.5);
    return [r0 * k, g0 * k, b0 * k];
  }, 1);
}

// ---------- materials ----------
const MAT = {
  black: new THREE.MeshPhysicalMaterial({ color: 0x151517, roughness: 0.62, metalness: 0.0, clearcoat: 0.15, clearcoatRoughness: 0.6 }),
  gold: new THREE.MeshPhysicalMaterial({ color: 0xd6ad55, roughness: 0.3, metalness: 0.92 }),
  brass: new THREE.MeshPhysicalMaterial({ color: 0xc8a25a, roughness: 0.35, metalness: 0.9 }),
  ivory: new THREE.MeshPhysicalMaterial({ color: 0xf1ebe0, roughness: 0.72, metalness: 0.0 }),
  sand: new THREE.MeshPhysicalMaterial({ color: 0xe3d5bf, roughness: 0.75, metalness: 0.0 }),
  white: new THREE.MeshPhysicalMaterial({ color: 0xf4f4f1, roughness: 0.38, metalness: 0.15, sheen: 0.3 }),
  silver: new THREE.MeshPhysicalMaterial({ color: 0xe9e9ea, roughness: 0.32, metalness: 0.6 }),
  wood: new THREE.MeshPhysicalMaterial({ map: woodTexture('#b78d64'), roughness: 0.68, metalness: 0.0 }),
  walnut: new THREE.MeshPhysicalMaterial({ map: woodTexture('#6e4a31'), roughness: 0.62, metalness: 0.0 }),
  steel: new THREE.MeshPhysicalMaterial({ color: 0xbfc3c7, roughness: 0.28, metalness: 1.0 }),
  keybrass: new THREE.MeshPhysicalMaterial({ color: 0xc9a35b, roughness: 0.3, metalness: 1.0 }),
  leather: new THREE.MeshPhysicalMaterial({ color: 0x5a3a26, roughness: 0.78, metalness: 0.0 }),
  leatherblack: new THREE.MeshPhysicalMaterial({ color: 0x232120, roughness: 0.7, metalness: 0.0 }),
  phone: new THREE.MeshPhysicalMaterial({ color: 0x141518, roughness: 0.15, metalness: 0.3, clearcoat: 1 }),
  glass: new THREE.MeshPhysicalMaterial({ color: 0x0b0c0e, roughness: 0.05, metalness: 0.2, clearcoat: 1 }),
  clear: new THREE.MeshPhysicalMaterial({ color: 0xf2f6f5, roughness: 0.25, metalness: 0.0, clearcoat: 0.6, transparent: true, opacity: 0.38, depthWrite: false }),
};
for (const [k, v] of Object.entries(cfg.colors || {})) { if (MAT[k]) MAT[k].color = new THREE.Color(v); }

// Box-projected UVs (no UVs come with STL)
function boxUV(geo, scale = 1 / 140) {
  const p = geo.attributes.position, n = geo.attributes.normal, uv = new Float32Array(p.count * 2);
  for (let i = 0; i < p.count; i++) {
    const ax = Math.abs(n.getX(i)), ay = Math.abs(n.getY(i)), az = Math.abs(n.getZ(i));
    let u, v;
    if (az >= ax && az >= ay) { u = p.getY(i); v = p.getX(i); }
    else if (ay >= ax) { u = p.getZ(i); v = p.getX(i); }
    else { u = p.getY(i); v = p.getZ(i); }
    uv[2 * i] = u * scale; uv[2 * i + 1] = v * scale;
  }
  geo.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
}

// ---------- wall ----------
const wallMat = new THREE.MeshStandardMaterial({ map: wallTexture(cfg.wall || '#c9c4b8', cfg.wallKind || 'plaster'), roughness: 0.95 });
wallMat.map.repeat.set(6, 6);
const wall = new THREE.Mesh(new THREE.PlaneGeometry(1400, 1400), wallMat);
wall.position.set(cfg.target?.[0] || 0, cfg.target?.[1] || 0, -0.2);
wall.receiveShadow = true;
scene.add(wall);

// ---------- lights ----------
scene.add(new THREE.HemisphereLight(0xffffff, 0x8a8170, cfg.hemi ?? 0.55));
const sun = new THREE.DirectionalLight(0xfff4e6, cfg.sun ?? 2.4);
const L = cfg.light || [-260, 420, 520];
sun.position.set(L[0], L[1], L[2]);
sun.target.position.set(cfg.target?.[0] || 0, cfg.target?.[1] || 0, 0);
sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096);
const sc = sun.shadow.camera; sc.left = -320; sc.right = 320; sc.top = 320; sc.bottom = -320; sc.near = 10; sc.far = 2000;
sun.shadow.radius = cfg.shadowRadius ?? 9; sun.shadow.blurSamples = 24; sun.shadow.bias = -0.0004;
scene.add(sun); scene.add(sun.target);
const fill = new THREE.DirectionalLight(0xe8f0ff, cfg.fill ?? 0.5);
fill.position.set(400, 120, 600); scene.add(fill);

// ---------- props ----------
function rbox(w, h, d, r, mat) {
  const s = new THREE.Shape();
  s.moveTo(-w / 2 + r, -h / 2); s.lineTo(w / 2 - r, -h / 2); s.quadraticCurveTo(w / 2, -h / 2, w / 2, -h / 2 + r);
  s.lineTo(w / 2, h / 2 - r); s.quadraticCurveTo(w / 2, h / 2, w / 2 - r, h / 2); s.lineTo(-w / 2 + r, h / 2);
  s.quadraticCurveTo(-w / 2, h / 2, -w / 2, h / 2 - r); s.lineTo(-w / 2, -h / 2 + r); s.quadraticCurveTo(-w / 2, -h / 2, -w / 2 + r, -h / 2);
  const g = new THREE.ExtrudeGeometry(s, { depth: d, bevelEnabled: true, bevelThickness: Math.min(1.2, d / 4), bevelSize: Math.min(1.2, d / 4), bevelSegments: 3, curveSegments: 12 });
  g.translate(0, 0, -d / 2);
  const m = new THREE.Mesh(g, mat); m.castShadow = m.receiveShadow = true; return m;
}
function keyShape() {
  const s = new THREE.Shape();
  s.absarc(0, 0, 11, 0, Math.PI * 2, false);
  const hole = new THREE.Path(); hole.absarc(0, 6, 2.6, 0, Math.PI * 2, true); s.holes.push(hole);
  const blade = new THREE.Shape();
  blade.moveTo(-3.2, -6); blade.lineTo(3.2, -6); blade.lineTo(3.2, -50); blade.lineTo(0.5, -54); blade.lineTo(-3.2, -54);
  const teeth = [-24, -30, -36, -42, -48];
  blade.lineTo(-3.2, -50);
  for (let i = teeth.length - 1; i >= 0; i--) { blade.lineTo(-3.2, teeth[i] - 1.5); blade.lineTo(-6.2, teeth[i]); blade.lineTo(-3.2, teeth[i] + 1.5); }
  blade.lineTo(-3.2, -6);
  return [s, blade];
}
function makeKeys(x, y, z, opts = {}) {
  const g = new THREE.Group();
  const R = 13, tube = 1.15;
  const ring = new THREE.Mesh(new THREE.TorusGeometry(R, tube, 16, 72), MAT.steel);
  ring.castShadow = true; g.add(ring);
  ring.position.set(0, -R + (opts.peg_r || 5.25) + tube, 0);
  const cy = ring.position.y - R;
  const mats = [MAT.keybrass, MAT.steel];
  [-18, 12].forEach((ang, i) => {
    const kg = new THREE.Group();
    for (const sh of keyShape()) {
      const geo = new THREE.ExtrudeGeometry(sh, { depth: 2.2, bevelEnabled: true, bevelThickness: 0.3, bevelSize: 0.3, bevelSegments: 2 });
      const m = new THREE.Mesh(geo, mats[i]); m.castShadow = true; kg.add(m);
    }
    kg.position.set(0, cy + 4, i ? 1.5 : -1.5);
    kg.rotation.z = THREE.MathUtils.degToRad(ang);
    kg.translateY(-6);
    g.add(kg);
  });
  if (opts.fob) {
    const fob = rbox(16, 40, 4, 6, opts.fob === 'black' ? MAT.leatherblack : MAT.leather);
    fob.position.set(0, cy - 22, 3.5); fob.rotation.z = THREE.MathUtils.degToRad(-4); g.add(fob);
  }
  g.position.set(x, y, z);
  g.rotation.z = THREE.MathUtils.degToRad(opts.tilt || 0);
  return g;
}
function addProp(p) {
  let m;
  if (p.type === 'keys') m = makeKeys(p.x, p.y, p.z, p);
  else if (p.type === 'phone') {
    m = new THREE.Group();
    const body = rbox(p.w || 72, p.h || 148, 8, 9, MAT.phone); m.add(body);
    const scr = rbox((p.w || 72) - 4, (p.h || 148) - 4, 0.4, 7.5, MAT.glass); scr.position.z = 4.3; m.add(scr);
    m.position.set(p.x, p.y, p.z); m.rotation.set(...(p.rot || [0, 0, 0]).map(THREE.MathUtils.degToRad));
  } else if (p.type === 'box') {
    m = rbox(p.w, p.h, p.d, p.r || 3, MAT[p.material || 'leather']);
    m.position.set(p.x, p.y, p.z); m.rotation.set(...(p.rot || [0, 0, 0]).map(THREE.MathUtils.degToRad));
  } else if (p.type === 'pod') {
    m = rbox(p.w || 46, p.h || 22, p.d || 54, 10, new THREE.MeshPhysicalMaterial({ color: 0xf6f6f4, roughness: 0.25, clearcoat: 0.8 }));
    m.position.set(p.x, p.y, p.z);
  }
  if (m) scene.add(m);
}

// ---------- model ----------
const loader = new STLLoader();
const manifest = await (await fetch(cfg.base + 'manifest.json')).json();
for (const item of manifest) {
  const geo = await loader.loadAsync(cfg.base + item.file);
  const matKey = (cfg.materialMap && cfg.materialMap[item.material]) || item.material;
  if (matKey === 'wood' || matKey === 'walnut') boxUV(geo);
  const mesh = new THREE.Mesh(geo, MAT[matKey] || MAT.black);
  mesh.castShadow = matKey !== 'clear'; mesh.receiveShadow = true;
  scene.add(mesh);
}
for (const p of cfg.props || []) addProp(p);

const cam = new THREE.PerspectiveCamera(cfg.fov || 28, W / H, 5, 5000);
cam.position.set(...cfg.camera);
cam.lookAt(new THREE.Vector3(...cfg.target));
renderer.render(scene, cam);
window.DONE = true;
</script>
</body>
</html>
